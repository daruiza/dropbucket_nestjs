version: '3.8'

services:
  wesql:
    container_name: dropbucket_wesql
    image: apecloud/wesql-server
    environment:
      - MYSQL_DATABASE=${POSTGRES_DB}
      - MYSQL_ROOT_USER=${POSTGRES_USER}
      - MYSQL_ROOT_PASSWORD=${POSTGRES_PASSWORD}

      # - MYSQL_PORT=3306
      # - MYSQL_HOST=127.0.0.1

      # - AWS_ACCESS_KEY_ID=${POSTGRES_PASSWORD}
      # - AWS_SECRET_ACCESS_KEY=${POSTGRES_PASSWORD}
      # - AWS_DEFAULT_REGION=${POSTGRES_PASSWORD}

      # - WESQL_OBJECTSTORE_ACCESS_KEY=${POSTGRES_PASSWORD}
      # - WESQL_OBJECTSTORE_SECRET_KEY=${POSTGRES_PASSWORD}

  postgres:
    container_name: dropbucket_postgres
    image: postgres:13.16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - dropbucket_volume:/var/lib/postgresql/data

  nestjs:
    container_name: dropbucket_nestjs
    image: node:22.7.0-alpine3.20
    working_dir: /app
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./:/app
    environment:
      - NODE_ENV=development
    command: sh -c "npm install -g @nestjs/cli && npm run start:devtsnd"
    depends_on:
      - postgres

volumes:
  dropbucket_volume:
    external: true
